<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memoria · Construction World</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("cw-theme")||"dark"}catch(e){}</script>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f5a524'/%3E%3Ctext x='50' y='66' font-size='46' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%231a1205'%3ECW%3C/text%3E%3C/svg%3E">
</head>
<body data-page="memoria">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="pagehead">
      <div>
        <p class="crumbs">Seguimiento <span>/</span> Historial</p>
        <h1>Memoria</h1>
        <p class="sub">Todo lo que se ha hecho, leído en vivo de <code>memoria.md</code>. Lo más reciente aparece primero.</p>
      </div>
      <div class="pagehead-stats">
        <div><b id="mTotal">0</b><span>Entradas</span></div>
        <div><b id="mDays">0</b><span>Días</span></div>
        <div class="accent"><b id="mLast">—</b><span>Última</span></div>
      </div>
    </header>

    <div class="toolbar">
      <label class="field-search"><input class="search" id="mSearch" type="search" placeholder="Buscar en la memoria…" autocomplete="off"></label>
      <select class="select" id="mDay"><option value="all">Todos los días</option></select>
      <select class="select" id="mOrder">
        <option value="desc">Más nuevas primero</option>
        <option value="asc">Más antiguas primero</option>
      </select>
      <span class="meta-note" id="mNote"></span>
    </div>

    <div class="mem-list" id="memList"></div>

    <footer class="foot">
      <span>Fuente <code>memoria.md</code> (raíz del proyecto)</span>
      <span>Recarga para ver las entradas nuevas.</span>
    </footer>
  </main>
</div>

<script src="assets/data.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/memoria.js"></script>
</body>
</html>
