<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanban · Construction World</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("cw-theme")||"dark"}catch(e){}</script>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f5a524'/%3E%3Ctext x='50' y='66' font-size='46' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%231a1205'%3ECW%3C/text%3E%3C/svg%3E">
</head>
<body data-page="kanban">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main main-wide">
    <header class="pagehead">
      <div>
        <p class="crumbs">Seguimiento <span>/</span> Tablero</p>
        <h1>Kanban</h1>
        <p class="sub">Tareas de la hoja de ruta y bugs. Abre cualquier tarjeta para ver su bitácora; los bugs resueltos pasan solos a «Arreglados».</p>
      </div>
      <div class="pagehead-stats">
        <div><b id="kTodo">0</b><span>Por hacer</span></div>
        <div><b id="kDoing">0</b><span>En curso</span></div>
        <div><b id="kDone">0</b><span>Hechas</span></div>
        <div class="bad"><b id="kBug">0</b><span>Bugs</span></div>
        <div class="ok"><b id="kFixed">0</b><span>Arreglados</span></div>
      </div>
    </header>

    <div class="toolbar">
      <label class="field-search"><input class="search" id="kSearch" type="search" placeholder="Filtrar tarjetas…" autocomplete="off"></label>
      <select class="select" id="kPhase"><option value="all">Todos los hitos</option></select>
      <select class="select" id="kSort">
        <option value="order">Orden del plan</option>
        <option value="phase">Agrupar por hito</option>
      </select>
      <span class="meta-note" id="kNote"></span>
    </div>

    <div class="board" id="board"></div>

    <footer class="foot">
      <span>Actualizado <code id="updated"></code></span>
      <span>Fuente <code id="source"></code></span>
      <span>Clic o Enter sobre una tarjeta para abrir su detalle.</span>
    </footer>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <button class="modal-x" type="button" data-close aria-label="Cerrar detalle">×</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/kanban.js"></script>
</body>
</html>
